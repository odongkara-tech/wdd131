<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="A Week 4 activity using a JavaScript object to display a college course schedule.">
	<meta name="author" content="Odongkara Ronald">
	<title>JavaScript Objects | WDD 131</title>
	<link rel="stylesheet" href="styles/objects.css">
	<script src="scripts/objects.js" defer></script>
</head>
<body>
	<header>
		<p>WDD 131 · Week 4</p>
		<h1>JavaScript Objects</h1>
		<p>Course schedule</p>
	</header>
	<main>
		<section aria-labelledby="courseName">
			<h2 id="courseName">Course information</h2>
			<table id="sections">
				<caption>Available course sections</caption>
				<thead>
					<tr>
						<th scope="col">Section</th>
						<th scope="col">Enrolled</th>
						<th scope="col">Instructor</th>
					</tr>
				</thead>
				<tbody></tbody>
			</table>
		</section>
	</main>
	<footer><a href="../index.html">Back to course home</a></footer>
</body>
</html>
