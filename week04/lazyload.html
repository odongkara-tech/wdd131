<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="A Week 4 activity demonstrating native lazy loading with images.">
	<meta name="author" content="Odongkara Ronald">
	<title>Lazy Loading Images | WDD 131</title>
	<link rel="stylesheet" href="styles/lazyload.css">
	<script src="scripts/lazyload.js" defer></script>
</head>
<body>
	<header>
		<p>WDD 131 · Week 4</p>
		<p>Scroll down the page and observe when each image is requested in your browser’s developer tools.</p>
	</header>
	<main>
		<h1>Lazy Loading Images</h1>
		<figure>
			<img src="../images/temples/optimized3/accra-temple.jpg" alt="Accra Ghana Temple" width="400" height="600" loading="lazy">
			<figcaption>Accra, Ghana</figcaption>
		</figure>
		<figure>
			<img src="../images/temples/optimized3/johannesburg-temple.jpg" alt="Johannesburg South Africa Temple" width="400" height="600" loading="lazy">
			<figcaption>Johannesburg, South Africa</figcaption>
		</figure>
		<figure>
			<img src="../images/temples/optimized3/london-temple.jpg" alt="London England Temple" width="400" height="600" loading="lazy">
			<figcaption>London, England</figcaption>
		</figure>
		<figure>
			<img src="../images/temples/optimized3/manila-temple.jpg" alt="Manila Philippines Temple" width="400" height="600" loading="lazy">
			<figcaption>Manila, Philippines</figcaption>
		</figure>
		<figure>
			<img src="../images/temples/optimized3/rome-temple.jpg" alt="Rome Italy Temple" width="400" height="600" loading="lazy">
			<figcaption>Rome, Italy</figcaption>
		</figure>
		<figure>
			<img src="../images/temples/optimized3/salt-lake-temple.jpg" alt="Salt Lake Temple" width="400" height="600" loading="lazy">
			<figcaption>Salt Lake City, Utah</figcaption>
		</figure>
	</main>
	<footer>
		<p><a href="../index.html">Back to course home</a></p>
		<p>Document last modified: <time id="last-modified">Loading date…</time></p>
	</footer>
</body>
</html>
