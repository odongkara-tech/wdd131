<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="A Week 4 HTML tables activity demonstrating accessible table structure and row striping.">
	<meta name="author" content="Odongkara Ronald">
	<title>HTML Tables | WDD 131</title>
	<link rel="stylesheet" href="styles/tables.css">
</head>
<body>
	<header>
		<p>WDD 131 · Week 4</p>
		<h1>HTML Tables</h1>
		<p>A table of traditional Ugandan dishes and the regions they are associated with.</p>
	</header>
	<main>
		<table>
			<caption>Table 1: Account Feature Comparison</caption>
			<thead>
				<tr>
					<th colspan="4">ACME Wildwest Services</th>
				</tr>
				<tr>
					<td class="blank"></td>
					<th scope="col">Basic</th>
					<th scope="col">Premium</th>
					<th scope="col">Deluxe</th>
				</tr>
			</thead>
			<tbody>
				<tr>
					<th scope="row">Feature 1</th>
					<td>✔️</td>
					<td>✔️</td>
					<td>✔️</td>
				</tr>
				<tr>
					<th scope="row">Feature 2</th>
					<td>❌</td>
					<td>✔️</td>
					<td>✔️</td>
				</tr>
				<tr>
					<th scope="row">Feature 3</th>
					<td>❌</td>
					<td>❌</td>
					<td>✔️</td>
				</tr>
			</tbody>
		</table>
	</main>
	<footer><a href="../index.html">Back to course home</a></footer>
</body>
</html>
