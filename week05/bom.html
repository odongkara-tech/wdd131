<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Book of Mormon Chapters</title>
	<meta name="description" content="Add and manage favorite Book of Mormon chapters.">
	<meta name="author" content="Odongkara Ronald">
	<link rel="stylesheet" href="styles/bom.css">
	<script src="scripts/bom.js" defer></script>
</head>
<body>
	<h1>📖 Book of Mormon - Top 10</h1>
	<main>
		<label for="favchap">Enter Book and Chapter:</label>
		<div class="input">
			<input type="text" id="favchap" placeholder="Alma 5" autocomplete="off">
			<button type="button">Add Chapter</button>
		</div>
		<ul id="list" aria-label="Favorite Book of Mormon chapters"></ul>
	</main>
</body>
</html>
